name: Fetch Vale Royal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Vale Royal
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.parse, urllib.request

          NAME = "Vale Royal Abbey"
          MATCH = "Vale Royal"
          RADIUS = 1800
          SERVERS = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
              "https://overpass.openstreetmap.fr/api/interpreter",
          ]
          UA = "golf-caddie-course-fetch/1.0 (GitHub Actions)"

          def overpass(q):
              for rnd in range(3):
                  for s in SERVERS:
                      try:
                          req = urllib.request.Request(s, data=urllib.parse.urlencode({"data": q}).encode(), headers={"User-Agent": UA})
                          with urllib.request.urlopen(req, timeout=40) as r:
                              data = json.load(r)
                          rm = str(data.get("remark", "")).lower()
                          if "error" in rm or "timed out" in rm:
                              raise RuntimeError(data.get("remark"))
                          return data
                      except Exception as e:
                          print("  server failed:", s, e, flush=True)
                          time.sleep(3)
              raise RuntimeError("All map servers failed")

          # The abbey sits in the middle of the course, so search around it
          lat, lon = 53.2247, -2.5426
          print("Searching around the abbey", lat, lon, flush=True)

          # Get the hole lines, greens and hazards around that centre
          around = f"(around:{RADIUS},{lat},{lon})"
          parts = "".join(f'way["golf"="{t}"]{around};' for t in ("hole", "green", "bunker", "water_hazard", "lateral_water_hazard"))
          d2 = overpass(f"[out:json][timeout:25];({parts});out geom;")

          els = []
          for w in d2.get("elements", []):
              g = [p for p in w.get("geometry", []) if p]
              tags = w.get("tags", {})
              if len(g) < 2 or "golf" not in tags: continue
              els.append({
                  "tags": {k: tags[k] for k in ("golf", "ref", "par") if k in tags},
                  "geometry": [{"lat": round(p["lat"], 6), "lon": round(p["lon"], 6)} for p in g],
              })
          # Men's pars from the scorecard (Map data has none for this course)
          PARS = {1:4,2:5,3:4,4:4,5:4,6:3,7:4,8:4,9:4,10:3,11:4,12:4,13:4,14:4,15:5,16:3,17:4,18:5}
          for e in els:
              t = e["tags"]
              if t["golf"] == "hole" and str(t.get("ref", "")).isdigit():
                  t["par"] = str(PARS.get(int(t["ref"]), t.get("par", "")))
          holes = sum(1 for e in els if e["tags"]["golf"] == "hole")
          greens = sum(1 for e in els if e["tags"]["golf"] == "green")
          print(f"{len(els)} features, {holes} hole lines, {greens} greens", flush=True)
          if holes == 0:
              print("No hole lines found, not saving.")
              sys.exit(1)

          os.makedirs("courses", exist_ok=True)
          fn = "vale-royal-abbey.json"
          with open("courses/" + fn, "w") as f:
              json.dump({"name": NAME, "lat": lat, "lng": lon, "elements": els}, f, separators=(",", ":"))

          # Merge into the index, keeping every other course that is already saved
          try:
              index = json.load(open("courses/index.json"))
          except Exception:
              index = []
          index = [c for c in index if c.get("name") != NAME]
          index.append({"name": NAME, "lat": lat, "lng": lon, "file": fn})
          with open("courses/index.json", "w") as f:
              json.dump(index, f, indent=1)
          print("Saved. Courses in index:", len(index))
          PY
      - name: Save to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add courses
          git commit -m "Add Vale Royal course" || echo "No changes"
          git pull --rebase || true
          git push
