name: Fetch courses

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download courses
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.parse, urllib.request
          COURSES = [
              ("Vale Royal Abbey", "Vale Royal"),
              ("Delamere Forest", "Delamere Forest"),
              ("Sandiway", "Sandiway"),
              ("Frodsham", "Frodsham"),
              ("Runcorn", "Runcorn"),
              ("Widnes", "Widnes"),
              ("Northwich", "Northwich"),
              ("Portal", "Portal"),
          ]
          BBOX = "52.9,-3.4,53.8,-1.9"
          RADIUS = 1500
          SERVERS = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
              "https://overpass.openstreetmap.fr/api/interpreter",
          ]
          UA = "golf-caddie-course-fetch/1.0 (GitHub Actions)"
          def overpass(q):
              last = None
              for rnd in range(3):
                  for s in SERVERS:
                      try:
                          req = urllib.request.Request(s, data=urllib.parse.urlencode({"data": q}).encode(), headers={"User-Agent": UA})
                          with urllib.request.urlopen(req, timeout=120) as r:
                              return json.load(r)
                      except Exception as e:
                          last = e
                          print("  server failed:", s, e)
                          time.sleep(3)
                  time.sleep(15)
              raise RuntimeError(last)
          def slug(n):
              return re.sub(r"[^a-z0-9]+", "-", n.lower()).strip("-")
          os.makedirs("courses", exist_ok=True)
          old = {}
          try:
              old = {c["name"]: c for c in json.load(open("courses/index.json"))}
          except Exception:
              pass
          index = []
          for name, match in COURSES:
              print("==", name)
              try:
                  q = f'[out:json][timeout:60];nwr["leisure"="golf_course"]["name"~"{match}",i]({BBOX});out center tags;'
                  found = [e for e in overpass(q).get("elements", []) if e.get("center") or "lat" in e]
                  if not found:
                      print("  not found in OpenStreetMap")
                      raise LookupError("not found")
                  c = found[0].get("center") or {"lat": found[0]["lat"], "lon": found[0]["lon"]}
                  lat, lon = c["lat"], c["lon"]
                  around = f"(around:{RADIUS},{lat},{lon})"
                  parts = "".join(f'way["golf"="{t}"]{around};' for t in ("hole", "green", "bunker", "water_hazard", "lateral_water_hazard"))
                  data = overpass(f"[out:json][timeout:60];({parts});out geom;")
                  els = []
                  for w in data.get("elements", []):
                      g = [p for p in w.get("geometry", []) if p]
                      tags = w.get("tags", {})
                      if len(g) < 2 or "golf" not in tags:
                          continue
                      els.append({
                          "tags": {k: tags[k] for k in ("golf", "ref", "par") if k in tags},
                          "geometry": [{"lat": round(p["lat"], 6), "lon": round(p["lon"], 6)} for p in g],
                      })
                  holes = sum(1 for e in els if e["tags"]["golf"] == "hole")
                  greens = sum(1 for e in els if e["tags"]["golf"] == "green")
                  print(f"  {len(els)} features, {holes} hole lines, {greens} greens")
                  fn = slug(name) + ".json"
                  with open("courses/" + fn, "w") as f:
                      json.dump({"name": name, "lat": lat, "lng": lon, "elements": els}, f, separators=(",", ":"))
                  index.append({"name": name, "lat": lat, "lng": lon, "file": fn})
              except Exception as e:
                  print("  skipped:", e)
                  if name in old and os.path.exists("courses/" + old[name]["file"]):
                      index.append(old[name])
          if not index:
              print("No courses could be downloaded. Run it again later.")
              sys.exit(1)
          with open("courses/index.json", "w") as f:
              json.dump(index, f, indent=1)
          print("Saved", len(index), "courses")
          PY
      - name: Save to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add courses
          git commit -m "Update preloaded courses" || echo "No changes"
          git push
