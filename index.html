<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Club">
<meta name="color-scheme" content="light dark">
<title>Club</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14281d;--chalk:#f2f4ef;--flag:#d8432f;--sand:#c9b27c;--line:#cfd6c9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eee8;--chalk:#17231c;--line:#33473b;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e6eee8;--chalk:#17231c;--line:#33473b;color-scheme:dark}
input,textarea,select{background:var(--chalk);color:var(--ink)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Archivo,system-ui,sans-serif;background:var(--chalk);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#map{flex:1;min-height:0}
#sheet{background:var(--chalk);border-top:3px solid var(--ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-height:52%;overflow:auto}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.club{font-size:44px;font-weight:800;line-height:1}
.plays{font-size:18px;font-weight:600}
.meta{font-size:14px;margin:6px 0;opacity:.85}
.alt{font-size:14px;margin-top:4px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:10px 14px;border:2px solid var(--ink);background:var(--chalk);color:var(--ink);border-radius:6px}
button.p{background:var(--ink);color:var(--chalk)}
#bag{display:none}
.bagrow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.bagrow input{width:80px;font:inherit;padding:6px;border:1px solid var(--ink);border-radius:4px;text-align:right}
label.s{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.holerow{display:flex;gap:8px;margin-bottom:8px}
#hl{flex:1;padding:6px 10px}
#hp,#hn{padding:6px 14px}
.tag{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-bottom:2px;min-height:14px}
.windbox{background:rgba(20,40,29,.85);color:#fff;border-radius:8px;padding:6px 8px;text-align:center;font-weight:600;font-size:13px;line-height:1.15;min-width:64px;pointer-events:none}
.windbox small{display:block;font-weight:400;opacity:.8;font-size:11px}
select{font:inherit;font-weight:600;padding:9px;border:2px solid var(--ink);border-radius:6px;background:var(--chalk);color:var(--ink);max-width:45%}
.aim{background:#ffd23f;border:2px solid #fff;border-radius:50%}
.pin{background:var(--flag);border:2px solid #fff;border-radius:50%}
.me{background:#1d6fe8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #1d6fe8}
</style>
</head>
<body>
<div id="map"></div>
<div id="sheet">
  <div id="play">
    <div class="meta" id="simbar" style="display:none;margin-top:0"><b>Test position.</b> Long-press the map to move, or drag the blue dot. <button id="simExit" style="padding:4px 10px;margin-left:6px">Use GPS</button></div>
    <div class="holerow"><button id="hp">‹</button><button id="hl">No hole data</button><button id="hn">›</button></div>
    <div class="tag" id="tag"></div>
    <div class="big"><span class="club" id="club">–</span><span class="plays" id="plays">Waiting for GPS</span></div>
    <div class="meta" id="meta">Allow location when Safari asks.</div>
    <div class="alt" id="alt"></div>
    <div class="meta" id="haz"></div>
    <div class="row" id="shotrow"><select id="shotClub"></select><button class="p" id="shotBtn">Start shot</button><button id="shotX" style="display:none">Cancel</button></div>
    <div class="row"><button class="p" id="find">Find hole</button><button id="clear">Clear aim</button><button id="bagBtn">Bag and settings</button></div>
  </div>
  <div id="bag">
    <div class="row" style="margin:0 0 8px"><button class="p" id="back">Done</button></div>
    <label class="s">Range ball boost (%)<input type="number" id="boost" step="0.5" style="width:80px;font:inherit;padding:6px;border:1px solid var(--ink);border-radius:4px;text-align:right"></label>
    <label class="s">Theme<select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <div class="meta">Carry yards at the range, per club. Real balls go further by the boost above.</div>
    <div id="clubs"></div>
    <div class="meta" style="margin-top:14px"><b>Shot log</b> (walked distance, so it includes roll)</div>
    <div id="shotstats" class="meta"></div>
    <div class="row"><button id="shotClear">Clear shot log</button></div>
    <div class="meta" style="margin-top:14px"><b>Import range session</b> (CSV export)</div>
    <input type="file" id="impFile" accept=".csv,.txt,text/csv,text/plain">
    <textarea id="impText" rows="4" placeholder="…or paste the CSV here" style="width:100%;font:inherit;margin-top:6px"></textarea>
    <div class="row"><button id="impPrev">Preview</button><button class="p" id="impApply" style="display:none">Apply to bag</button></div>
    <div class="meta" id="impOut"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
<script>
const DEFAULT_BAG={"Driver":230,"3 wood":210,"5 wood":195,"4 iron":180,"5 iron":170,"6 iron":160,"7 iron":150,"8 iron":140,"9 iron":130,"PW":118,"GW":105,"SW":90,"LW":70};
let S;
try{S=JSON.parse(localStorage.getItem("club-v1"))}catch(e){}
if(!S)S={bag:DEFAULT_BAG,boost:4};
const save=()=>{try{localStorage.setItem("club-v1",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const YD=1.09361, R=6371000, rad=d=>d*Math.PI/180;

// Map
const map=L.map("map",{zoomControl:false,maxZoom:20}).setView([53.2465,-2.5755],16);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,attribution:"Esri"}).addTo(map);
const overlay=L.layerGroup().addTo(map), holeLayer=L.layerGroup().addTo(map);
// Wind badge: the arrow points the way the wind is blowing (map is north-up)
const windCtl=L.control({position:"topright"});
windCtl.onAdd=()=>{
  const d=L.DomUtil.create("div","windbox");
  d.innerHTML='<svg viewBox="-20 -20 40 40" width="40" height="40"><g id="wg"><path d="M0 -17 L10 3 L3.5 3 L3.5 17 L-3.5 17 L-3.5 3 L-10 3 Z" fill="#fff"/></g></svg><div id="wspd">Wind –</div><small id="wsub">loading</small>';
  return d;
};
windCtl.addTo(map);
const COMP=["N","NE","E","SE","S","SW","W","NW"];
function updateWind(){
  if(!wx)return;
  $("wg").setAttribute("transform",`rotate(${Math.round((wx.d+180)%360)})`);
  $("wspd").textContent=`${Math.round(wx.w)} mph`;
  $("wsub").textContent=`from ${COMP[Math.round(wx.d/45)%8]}`+(wx.g&&wx.g>wx.w+3?` · gusts ${Math.round(wx.g)}`:"");
}
let me=null,meMarker=null,aim=null,aimMarker=null,greenMarker=null,greenLine=null,aimLine=null,wx=null;
let holes=[],greens=[],hazards=[],toast="",fetchedAt=null,fetching=false,cur=null,manual=false,note="";

function dist(a,b){const dp=rad(b.lat-a.lat),dl=rad(b.lng-a.lng);const x=Math.sin(dp/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))*YD}
function bearing(a,b){const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat));const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (Math.atan2(y,x)*180/Math.PI+360)%360}

// Distance in metres from point p to a hole line (tee to green)
function toXY(q,o){return {x:rad(q.lng-o.lng)*Math.cos(rad(o.lat))*R,y:rad(q.lat-o.lat)*R}}
function segDist(a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?(-a.x*dx-a.y*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(a.x+t*dx,a.y+t*dy)}
function holeDist(h,p){const xy=h.pts.map(q=>toXY(q,p));if(xy.length<2)return Math.hypot(xy[0].x,xy[0].y);let m=1e9;for(let i=0;i<xy.length-1;i++)m=Math.min(m,segDist(xy[i],xy[i+1]));return m}

// Position: real GPS, or a test position (long-press the map; drag the blue dot to walk the hole)
let sim=false,realPos=null,swallowClick=false;
function setMe(lat,lng){
  const first=!me;
  me={lat,lng};
  if(!meMarker){
    meMarker=L.marker(me,{draggable:true,icon:L.divIcon({className:"",html:'<div class="me" style="width:16px;height:16px"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
    meMarker.on("drag",e=>{if(!sim)return;const q=e.target.getLatLng();me={lat:q.lat,lng:q.lng};update()});
    meMarker.on("dragend",()=>{if(sim&&fetchedAt&&dist(me,fetchedAt)>600){loadCourse();loadWeather()}});
    if(!sim)meMarker.dragging.disable();
  }else meMarker.setLatLng(me);
  if(first&&!sim){map.setView(me,18);loadWeather()}
  if(first||(fetchedAt&&dist(me,fetchedAt)>600))loadCourse();
  update();
}
navigator.geolocation.watchPosition(p=>{
  realPos={lat:p.coords.latitude,lng:p.coords.longitude};
  if(!sim)setMe(realPos.lat,realPos.lng);
},e=>{$("meta").textContent="No GPS: "+e.message+". Check Safari location permission for this site."},{enableHighAccuracy:true,maximumAge:2000});

function startSim(ll){
  sim=true;
  if(aimMarker){map.removeLayer(aimMarker);aimMarker=null}aim=null;
  lastMeElev=null;manual=false;cur=null;
  setMe(ll.lat,ll.lng);
  meMarker.dragging.enable();
  map.setView(me,Math.max(map.getZoom(),18));
  loadWeather();
}
function exitSim(){
  sim=false;
  if(meMarker)meMarker.dragging.disable();
  lastMeElev=null;
  if(realPos){setMe(realPos.lat,realPos.lng);map.setView(me,18);loadWeather()}
  else{me=null;if(meMarker){map.removeLayer(meMarker);meMarker=null}update()}
}
$("simExit").onclick=exitSim;
// long-press on the map (about 0.6 s, without moving) sets the test position
{
  const box=map.getContainer();let t=null,sx=0,sy=0;
  const stop=()=>{if(t){clearTimeout(t);t=null}};
  box.addEventListener("pointerdown",e=>{
    if(e.target.closest&&e.target.closest(".leaflet-marker-icon,.leaflet-control"))return;
    sx=e.clientX;sy=e.clientY;stop();
    t=setTimeout(()=>{
      t=null;swallowClick=true;setTimeout(()=>{swallowClick=false},900);
      const r=box.getBoundingClientRect();
      startSim(map.containerPointToLatLng([sx-r.left,sy-r.top]));
    },600);
  });
  box.addEventListener("pointermove",e=>{if(t&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)stop()});
  box.addEventListener("pointerup",stop);box.addEventListener("pointercancel",stop);
}

async function loadWeather(){
  if(!me)return;
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${me.lat}&longitude=${me.lng}&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=mph`);
    const j=await r.json();wx={t:j.current.temperature_2m,w:j.current.wind_speed_10m,d:j.current.wind_direction_10m,g:j.current.wind_gusts_10m};
    try{localStorage.setItem("wx-v1",JSON.stringify({wx,t:Date.now()}))}catch(e){}
    updateWind();update();
  }catch(e){$("meta").textContent="Weather unavailable, using still air at 15°C."}
}
setInterval(loadWeather,600000);
try{const c=JSON.parse(localStorage.getItem("wx-v1"));if(c&&Date.now()-c.t<3*3600e3){wx=c.wx;updateWind()}}catch(e){}

// Course data from OpenStreetMap: hole lines, greens, hazards (saved on the phone for offline use)
function applyCourse(els){
  overlay.clearLayers();
  const hs=[],gs=[],hz=[];
  for(const w of els){
    if(!w.geometry)continue;
    const pts=w.geometry.map(g=>({lat:g.lat,lng:g.lon}));
    const kind=w.tags.golf;
    if(kind==="hole"){hs.push({ref:parseInt(w.tags.ref),par:w.tags.par,pts});continue}
    L.polygon(pts,{color:kind==="green"?"#7dff9a":kind==="bunker"?"#c9b27c":"#4aa3ff",weight:2,fillOpacity:.15,interactive:false}).addTo(overlay);
    if(kind==="green")gs.push({c:{lat:pts.reduce((s,p)=>s+p.lat,0)/pts.length,lng:pts.reduce((s,p)=>s+p.lng,0)/pts.length},pts});
    else{const la=pts.map(p=>p.lat),ln=pts.map(p=>p.lng);hz.push({kind:kind==="bunker"?"bunker":"water",pts,bb:{n:Math.max(...la),s:Math.min(...la),e:Math.max(...ln),w:Math.min(...ln)}})}
  }
  greens=gs;hazards=hz;
  // one line per hole number (keep the longest), sorted 1..18
  const byRef=new Map();
  for(const h of hs){const k=isNaN(h.ref)?"x"+byRef.size:h.ref;const o=byRef.get(k);if(!o||h.pts.length>o.pts.length)byRef.set(k,h)}
  holes=[...byRef.values()].sort((x,y)=>(isNaN(x.ref)?999:x.ref)-(isNaN(y.ref)?999:y.ref));
  // the green for each hole is the one nearest the end of the line (lines run tee to green)
  const near=pt=>{let b=null,bd=1e9;for(const g of greens){const d=dist(pt,g.c);if(d<bd){bd=d;b=g}}return bd<90?b:null};
  for(const h of holes)h.green=near(h.pts[h.pts.length-1])||near(h.pts[0]);
  cur=null;
  note=(!holes.length&&!greens.length)?"No course data nearby. Tap the map to set an aim point.":!holes.length?"No hole lines mapped here, using the nearest green.":"";
}
async function loadCourse(){
  if(!me||fetching)return;
  fetching=true;$("find").textContent="Searching…";
  const a=`(around:1500,${me.lat},${me.lng})`;
  const q=`[out:json][timeout:25];way["golf"~"^(hole|green|bunker|water_hazard|lateral_water_hazard)$"]${a};out geom;`;
  try{
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)});
    const j=await r.json();
    applyCourse(j.elements);
    fetchedAt={lat:me.lat,lng:me.lng};
    try{localStorage.setItem("course-v1",JSON.stringify({els:j.elements,at:fetchedAt}))}catch(e){}
  }catch(e){
    note=(holes.length||greens.length)?"Offline: using saved course data.":"Course data failed to load. Tap the map to set an aim point.";
  }
  fetching=false;$("find").textContent="Find hole";
  update();
}
try{const c=JSON.parse(localStorage.getItem("course-v1"));if(c&&c.els){applyCourse(c.els);fetchedAt=c.at;note=""}}catch(e){}
$("find").onclick=()=>{manual=false;loadCourse()};

// Which hole am I on? Nearest hole line, with a little hysteresis so it doesn't flicker.
function pickHole(){
  if(manual||!me||!holes.length){if(!holes.length)cur=null;return}
  let best=-1,bd=1e9;
  holes.forEach((h,i)=>{const d=holeDist(h,me);if(d<bd){bd=d;best=i}});
  if(bd>150){cur=null;return}               // not on a hole
  if(cur===null||best===cur){cur=best;return}
  if(holeDist(holes[cur],me)-bd>10)cur=best;
}
function nearestGreen(){
  if(!me||!greens.length)return null;
  let b=null,bd=1e9;for(const g of greens){const d=dist(me,g.c);if(d<bd){bd=d;b=g}}
  return bd<437?b:null;                       // within 400 m
}
function currentGreen(){
  if(cur!==null&&holes[cur])return holes[cur].green||nearestGreen();
  return nearestGreen();
}

// Hole picker buttons
function stepHole(n){
  if(!holes.length)return;
  manual=true;
  cur=cur===null?(n>0?0:holes.length-1):(cur+n+holes.length)%holes.length;
  update();
}
$("hp").onclick=()=>stepHole(-1);
$("hn").onclick=()=>stepHole(1);
$("hl").onclick=()=>{manual=false;update()};

// Aim point: tap the map or drag the yellow marker
function setAim(ll){
  aim={lat:ll.lat,lng:ll.lng};
  if(!aimMarker){
    aimMarker=L.marker(aim,{draggable:true,icon:L.divIcon({className:"",html:'<div class="aim" style="width:18px;height:18px"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
    aimMarker.on("drag",e=>{aim=e.target.getLatLng();update()});
  }else aimMarker.setLatLng(aim);
  update();
}
function clearAim(){
  aim=null;
  if(aimMarker){map.removeLayer(aimMarker);aimMarker=null}
  update();
}
map.on("click",e=>{if(swallowClick){swallowClick=false;return}setAim(e.latlng)});
$("clear").onclick=clearAim;

// Elevation: from a terrain model (about 25 m resolution), so it is good for slope trends, not exact heights
const ELEV=1.0;            // yards of extra (or less) distance per metre of height difference
const elevCache=new Map();
try{for(const [k,v] of JSON.parse(localStorage.getItem("elev-v1")||"[]"))elevCache.set(k,v)}catch(e){}
let elevTimer=null,elevBusy=false,elevRetryAt=0,lastMeElev=null;
const ekey=p=>p.lat.toFixed(4)+","+p.lng.toFixed(4);
function elevAt(p){
  const v=elevCache.get(ekey(p));
  if(p===me){if(v!==undefined){lastMeElev=v;return v}return lastMeElev}  // keep last value while a new one loads
  return v===undefined?null:v;
}
async function getElevs(ps){
  try{
    const loc=ps.map(p=>p.lat.toFixed(5)+","+p.lng.toFixed(5)).join("|");
    const r=await fetch("https://api.opentopodata.org/v1/eudem25m?locations="+loc);
    const j=await r.json();
    const v=j.results.map(x=>x.elevation);
    if(j.status!=="OK"||v.some(x=>typeof x!=="number"))throw new Error("bad data");
    return v;
  }catch(e){
    const la=ps.map(p=>p.lat.toFixed(5)).join(","),lo=ps.map(p=>p.lng.toFixed(5)).join(",");
    const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${la}&longitude=${lo}`);
    const j=await r.json();
    if(!Array.isArray(j.elevation))throw new Error("no elevation");
    return j.elevation;
  }
}
function queueElev(){if(elevTimer||Date.now()<elevRetryAt)return;elevTimer=setTimeout(fetchElev,600)}
async function fetchElev(){
  elevTimer=null;
  if(elevBusy||!me)return;
  elevBusy=true;
  const g=currentGreen();
  const miss=[],seen=new Set();
  for(const p of [me,aim,g&&g.c]){if(!p)continue;const k=ekey(p);if(!elevCache.has(k)&&!seen.has(k)){seen.add(k);miss.push([k,p])}}
  if(miss.length){
    try{const v=await getElevs(miss.map(m=>m[1]));miss.forEach((m,i)=>elevCache.set(m[0],v[i]));try{localStorage.setItem("elev-v1",JSON.stringify([...elevCache]))}catch(e){}}
    catch(e){elevRetryAt=Date.now()+30000}   // back off for 30 s, plays then ignores height
  }
  elevBusy=false;
  update();
}

function plays(pt){
  const d=dist(me,pt),b=bearing(me,pt);
  let adj=d,notes=[];
  if(wx){
    const head=wx.w*Math.cos(rad(wx.d-b)); // wind FROM direction aligned with target = headwind
    adj*=1+(head>0?head*0.01:head*0.005);
    adj*=1+(15-wx.t)*0.002;
    const side=Math.abs(wx.w*Math.sin(rad(wx.d-b)));
    notes.push(`${Math.round(wx.t)}°C, wind ${Math.round(wx.w)} mph (${head>=0?Math.round(head)+" into":Math.round(-head)+" behind"}, ${Math.round(side)} across)`);
  }
  const em=elevAt(me),et=elevAt(pt);
  if(em!==null&&et!==null){
    const dh=et-em;
    if(Math.abs(dh)>=1){adj+=dh*ELEV;notes.unshift(`${dh>0?"Uphill":"Downhill"} ${Math.round(Math.abs(dh))} m (${dh>0?"+":"−"}${Math.round(Math.abs(dh)*ELEV)} yd)`)}
  }
  return {d,adj,notes};
}

function update(){
  pickHole();
  // hole label and hole line
  holeLayer.clearLayers();
  if(cur!==null&&holes[cur]){
    const h=holes[cur];
    $("hl").textContent=`Hole ${isNaN(h.ref)?"?":h.ref}${h.par?" · par "+h.par:""}${manual?" · tap for auto":""}`;
    L.polyline(h.pts,{color:"#fff",weight:2,opacity:.55,interactive:false}).addTo(holeLayer);
  }else $("hl").textContent=holes.length?"Not on a hole":"No hole data";
  $("simbar").style.display=sim?"":"none";
  $("clear").disabled=!aim;$("clear").style.opacity=aim?1:.45;

  const g=currentGreen();
  // green pin and line
  if(g){
    if(!greenMarker)greenMarker=L.marker(g.c,{interactive:false,icon:L.divIcon({className:"",html:'<div class="pin" style="width:16px;height:16px"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
    else greenMarker.setLatLng(g.c);
  }else if(greenMarker){map.removeLayer(greenMarker);greenMarker=null}
  if(greenLine){map.removeLayer(greenLine);greenLine=null}
  if(aimLine){map.removeLayer(aimLine);aimLine=null}
  if(!me){$("tag").textContent="";$("club").textContent="–";$("plays").textContent="Waiting for GPS";$("meta").textContent="Allow location when Safari asks, or long-press the map to set a test position.";$("alt").textContent="";$("haz").textContent="";return}
  if(g)greenLine=L.polyline([me,g.c],{color:"#fff",weight:2,dashArray:"6 6",interactive:false}).addTo(map);
  if(aim)aimLine=L.polyline([me,aim],{color:"#ffd23f",weight:2,dashArray:"2 6",interactive:false}).addTo(map);

  const tgt=aim||(g&&g.c);
  if(!tgt){
    $("tag").textContent="";$("club").textContent="–";$("plays").textContent="No target";
    $("meta").textContent=[note,toast].filter(Boolean).join(" · ")||"Tap the map to set an aim point.";$("alt").textContent="";$("haz").textContent="";
    return;
  }
  if([me,tgt].some(q=>!elevCache.has(ekey(q))))queueElev();
  const p=plays(tgt);
  let range="";
  if(g){
    const ds=g.pts.map(q=>dist(me,q));
    range=`Green: front ${Math.round(Math.min(...ds))} · centre ${Math.round(dist(me,g.c))} · back ${Math.round(Math.max(...ds))}`;
  }
  const clubs=Object.entries(S.bag).map(([n,c])=>[n,c*(1+S.boost/100)]).sort((a,b)=>b[1]-a[1]);
  let best=clubs[0];
  for(const c of clubs)if(Math.abs(c[1]-p.adj)<Math.abs(best[1]-p.adj))best=c;
  const i=clubs.indexOf(best);
  $("tag").textContent=aim?"To aim point":"To green centre";
  $("club").textContent=best[0];
  $("plays").textContent=`plays ${Math.round(p.adj)} yd (${Math.round(p.d)} real)`;
  $("meta").textContent=[range,...p.notes,note,toast].filter(Boolean).join(" · ");
  if(!shotStart&&!selTouched&&[...$("shotClub").options].some(o=>o.value===best[0]))$("shotClub").value=best[0];
  // hazards between you and the target
  const hz=hazardsOnLine(me,tgt),carryReal=best[1]*p.d/p.adj;
  const nm=h=>(h.kind==="bunker"?"Bunker":"Water")+` ${Math.round(h.from)}–${Math.round(h.to)}`;
  const risky=hz.find(h=>carryReal>=h.from-8&&carryReal<=h.to+8);
  $("haz").textContent=hz.length?"On the line: "+hz.slice(0,4).map(nm).join(" · ")+" yd"+(risky?` · ${best[0]} carry ~${Math.round(carryReal)} yd is close to the ${risky.kind==="bunker"?"bunker":"water"}`:""):"";
  const up=clubs[i-1],dn=clubs[i+1];
  $("alt").textContent=`Carry ${Math.round(best[1])}`+(up?` · longer: ${up[0]} ${Math.round(up[1])}`:"")+(dn?` · shorter: ${dn[0]} ${Math.round(dn[1])}`:"");
}

// Hazards on the shot line
function inPoly(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a.lat>p.lat)!==(b.lat>p.lat)&&p.lng<(b.lng-a.lng)*(p.lat-a.lat)/(b.lat-a.lat)+a.lng)c=!c}return c}
function hazardsOnLine(a,b){
  const d=dist(a,b),step=2,n=Math.floor(d/step),out=[];
  if(n<2)return out;
  for(const h of hazards){
    const bb=h.bb;let first=null,last=null;
    for(let i=1;i<=n;i++){
      const t=i*step/d,p={lat:a.lat+(b.lat-a.lat)*t,lng:a.lng+(b.lng-a.lng)*t};
      if(p.lat<bb.s||p.lat>bb.n||p.lng<bb.w||p.lng>bb.e)continue;
      if(inPoly(p,h.pts)){if(first===null)first=i*step;last=i*step}
    }
    if(first!==null)out.push({kind:h.kind,from:first,to:last});
  }
  return out.sort((x,y)=>x.from-y.from);
}

// Keep the screen on while playing (starts after your first tap)
let wl=null;
async function keepAwake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
document.addEventListener("click",keepAwake);
document.addEventListener("touchend",keepAwake);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake()});

// Shot tracker: Start shot at the ball, Ball here when you reach it
let shots=[];try{shots=JSON.parse(localStorage.getItem("shots-v1"))||[]}catch(e){}
const saveShots=()=>{try{localStorage.setItem("shots-v1",JSON.stringify(shots))}catch(e){}};
let shotStart=null,selTouched=false;
function fillClubSelect(){const sel=$("shotClub"),v=sel.value;sel.innerHTML=Object.keys(S.bag).map(n=>`<option>${n}</option>`).join("");if(v)sel.value=v}
function endShot(){shotStart=null;$("shotBtn").textContent="Start shot";$("shotX").style.display="none";$("shotClub").disabled=false;selTouched=false;update()}
$("shotClub").onchange=()=>{selTouched=true};
$("shotBtn").onclick=()=>{
  if(!me)return;
  if(!shotStart){
    shotStart={club:$("shotClub").value,p:{lat:me.lat,lng:me.lng}};
    $("shotBtn").textContent="Ball here";$("shotX").style.display="";$("shotClub").disabled=true;
  }else{
    const d=Math.round(dist(shotStart.p,me));
    shots.push({c:shotStart.club,d,t:Date.now()});saveShots();
    toast=`Logged ${shotStart.club}: ${d} yd`;setTimeout(()=>{toast="";update()},8000);
    endShot();
  }
};
$("shotX").onclick=endShot;
function drawShots(){
  const rows=Object.keys(S.bag).map(n=>{const v=shots.filter(x=>x.c===n).map(x=>x.d);if(!v.length)return null;
    return `${n}: avg ${Math.round(v.reduce((a,b)=>a+b,0)/v.length)} yd · ${v.length} shot${v.length>1?"s":""} (${Math.min(...v)}–${Math.max(...v)})`}).filter(Boolean);
  $("shotstats").innerHTML=rows.length?rows.join("<br>"):"No shots logged yet.";
}
$("shotClear").onclick=()=>{shots=[];saveShots();drawShots()};

// Import a range session from CSV (club + carry columns)
function parseCSV(t){
  t=t.replace(/^\uFEFF/,"").trim();
  const first=t.split(/\r?\n/)[0];
  const del=[",",";","\t"].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;
    else if(ch===del){row.push(cell);cell=""}
    else if(ch==="\n"){row.push(cell);rows.push(row);row=[];cell=""}
    else if(ch!=="\r")cell+=ch;
  }
  row.push(cell);rows.push(row);return rows;
}
function bagName(raw){
  const s=String(raw).toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const n=(s.match(/\b(\d)\b/)||s.match(/\b(\d)[wi]\b/)||[])[1];
  if(/driver|^dr$|\b1w\b/.test(s))return "Driver";
  if(/wood|\b\dw\b/.test(s))return n==="3"?"3 wood":n==="5"?"5 wood":null;
  if(/iron|\b\di\b/.test(s))return n>=4&&n<=9?n+" iron":null;
  if(/pitching|\bpw\b/.test(s))return "PW";
  if(/gap|\bgw\b|approach|\baw\b/.test(s))return "GW";
  if(/sand|\bsw\b/.test(s))return "SW";
  if(/lob|\blw\b/.test(s))return "LW";
  return null;
}
let impResult=null;
function previewImport(){
  impResult=null;$("impApply").style.display="none";
  const txt=$("impText").value.trim();
  if(!txt){$("impOut").textContent="Choose a file or paste the CSV first.";return}
  const rows=parseCSV(txt).filter(r=>r.some(c=>c.trim()));
  const head=rows[0]||[];
  const ci=head.findIndex(h=>/club/i.test(h));
  let yi=head.findIndex(h=>/carry/i.test(h));
  if(yi<0)yi=head.findIndex(h=>/distance|total/i.test(h));
  if(ci<0||yi<0){$("impOut").textContent="Couldn't find club and carry columns. Columns found: "+head.join(", ");return}
  const metres=/\((m|meters?|metres?)\)|meters?|metres?/i.test(head[yi]);
  const by={},skipped=new Set();
  for(const r of rows.slice(1)){
    const nm=bagName(r[ci]||"");const v=parseFloat(String(r[yi]).replace(/[^0-9.\-]/g,""));
    if(!nm){if((r[ci]||"").trim())skipped.add(r[ci].trim());continue}
    if(!(v>0))continue;
    (by[nm]=by[nm]||[]).push(metres?v*YD:v);
  }
  const out={},lines=[];
  for(const [nm,v] of Object.entries(by)){
    const sorted=[...v].sort((a,b)=>a-b),med=sorted[Math.floor(sorted.length/2)];
    const good=v.filter(x=>x>=med*0.8);         // drop obvious mishits
    out[nm]=Math.round(good.reduce((a,b)=>a+b,0)/good.length);
    lines.push(`${nm}: ${out[nm]} yd (${good.length} of ${v.length} shots)`);
  }
  if(!lines.length){$("impOut").textContent="No recognisable clubs found.";return}
  impResult=out;
  $("impOut").innerHTML=(metres?"Converted from metres. ":"Treating values as yards. ")+"Averages exclude shots under 80% of the median.<br>"+lines.join("<br>")+(skipped.size?"<br>Skipped: "+[...skipped].join(", "):"");
  $("impApply").style.display="";
}
$("impFile").onchange=async e=>{const f=e.target.files[0];if(f){$("impText").value=await f.text();previewImport()}};
$("impPrev").onclick=previewImport;
$("impApply").onclick=()=>{
  if(!impResult)return;
  Object.assign(S.bag,impResult);save();drawBag();fillClubSelect();update();
  $("impApply").style.display="none";$("impOut").textContent="Bag updated.";impResult=null;
};

// Bag editor
function drawBag(){
  $("theme").value=S.theme||"auto";
  drawShots();
  $("boost").value=S.boost;
  $("clubs").innerHTML="";
  for(const [n,c] of Object.entries(S.bag)){
    const r=document.createElement("div");r.className="bagrow";
    r.innerHTML=`<span>${n}</span><input type="number" inputmode="numeric" value="${c}">`;
    r.querySelector("input").onchange=e=>{S.bag[n]=+e.target.value||0;save();update()};
    $("clubs").appendChild(r);
  }
}
function applyTheme(){const t=S.theme||"auto";if(t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}
applyTheme();
$("theme").onchange=e=>{S.theme=e.target.value;save();applyTheme()};
fillClubSelect();
$("boost").onchange=e=>{S.boost=+e.target.value||0;save();update()};
$("bagBtn").onclick=()=>{drawBag();$("play").style.display="none";$("bag").style.display="block"};
$("back").onclick=()=>{$("bag").style.display="none";$("play").style.display="block";map.invalidateSize()};
</script>
